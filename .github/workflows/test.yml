# Reusable test workflow.
#
# Called by:
#   - ci.yml              (PR checks + manual dispatch)
#   - release-prepare.yml (tag gate, before anything is published)
#
# Not triggered directly — `workflow_call` only.
#
# Every third-party action is pinned to a commit SHA with the release it
# corresponds to in a trailing comment. A tag is a movable pointer; a SHA is
# not, so a compromised or retagged action cannot silently enter a run that
# holds a crates.io token. Dependabot owns keeping the pins current — see
# .github/dependabot.yml.
#
# Jobs:
#   lint           — rustfmt, clippy, docs, doctests, shellcheck
#   test           — `cargo nextest run` on Linux / macOS / Windows, default and
#                    full features
#   feature-matrix — every feature combination that ships, plus wasm32
#   jit-platforms  — the JIT actually executed on ARM64 Linux and both macOS
#                    architectures; codegen bugs there are invisible to a
#                    compile-only check
#   cross-check    — bidirectional x86_64 ↔ aarch64 cross-compilation, which is
#                    where the dynasm `.arch` directives regress
#   msrv           — the MSRV declared in Cargo.toml, read from the manifest so
#                    the job and the published contract cannot drift apart
#   fuzz           — differential oracle against the reference matcher, on
#                    fixed seeds so a failure is reproducible
#   audit          — cargo-deny: advisories, licences, sources, banned crates

name: Test

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint, Format & Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: lint

      - name: Check formatting
        run: cargo fmt --all --check

      # `--all-targets` also type-checks the benches and examples, so a bench
      # that stops compiling fails here rather than the next time someone runs
      # `cargo bench` by hand.
      - name: Clippy (all features, all targets)
        run: cargo clippy --features full --all-targets -- -D warnings

      # Warnings are denied because the failure that matters here is silent: a
      # link to a private item renders as plain text rather than erroring, so
      # the published docs lose it and nothing reports why.
      - name: Build docs
        run: cargo doc --features full --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      # nextest does not run doctests; this is the only place they execute.
      - name: Run doctests
        run: cargo test --doc --features full

      - name: Shellcheck release scripts
        run: shellcheck scripts/ci/*.sh

  # ─────────────────────────────────────────────────────────────────────────
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: test-${{ matrix.os }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: nextest

      # Both configurations run: engine selection differs between them, so a
      # bug in an interpreted engine can be masked once the JIT takes over.
      - name: Run tests (default features)
        run: cargo nextest run --no-fail-fast

      - name: Run tests (full features)
        run: cargo nextest run --features full --no-fail-fast

      - name: Upload nextest report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nextest-${{ matrix.os }}
          path: target/nextest/default/junit.xml
          if-no-files-found: ignore

  # ─────────────────────────────────────────────────────────────────────────
  feature-matrix:
    name: Feature Compile & WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: feature-matrix

      - name: Install cargo-nextest
        uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: nextest

      - name: "Compile: no default features (minimal)"
        run: cargo check --no-default-features --all-targets

      - name: "Compile: simd only (default)"
        run: cargo check --all-targets

      - name: "Compile: jit only"
        run: cargo check --no-default-features --features jit --all-targets

      - name: "Compile: full"
        run: cargo check --features full --all-targets

      # The JIT has no wasm32 backend, so this is the configuration a wasm
      # consumer actually gets. Compile-only: there is no wasm runtime here.
      - name: "Compile: WASM (no default features)"
        run: cargo check --no-default-features --target wasm32-unknown-unknown

      - name: "Test: no default features"
        run: cargo nextest run --no-default-features --no-fail-fast

      - name: "Test: jit only"
        run: cargo nextest run --no-default-features --features jit --no-fail-fast

  # ─────────────────────────────────────────────────────────────────────────
  # The JIT emits architecture-specific machine code. A cross-compile proves it
  # assembles; only these runners prove it runs.
  jit-platforms:
    name: JIT (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            features: jit
          - name: macOS Intel
            os: macos-15-intel
            features: full
          - name: macOS ARM64
            os: macos-latest
            features: jit
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: jit-${{ matrix.os }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: nextest

      - name: Check
        run: cargo check --no-default-features --features ${{ matrix.features }}

      - name: Test
        run: cargo nextest run --no-default-features --features ${{ matrix.features }} --no-fail-fast

  # ─────────────────────────────────────────────────────────────────────────
  # dynasm blocks carry explicit `.arch` directives; without them the assembler
  # falls back to the host architecture and the code is silently wrong for the
  # target. That shipped twice (0.1.1, 0.1.2), which is why both directions are
  # checked rather than just the common one.
  cross-check:
    name: Cross-check (${{ matrix.name }})
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64 → aarch64
            runs-on: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            packages: gcc-aarch64-linux-gnu
            linker_env: CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER
            linker: aarch64-linux-gnu-gcc
          - name: aarch64 → x86_64
            runs-on: ubuntu-24.04-arm
            target: x86_64-unknown-linux-gnu
            packages: gcc-x86-64-linux-gnu
            linker_env: CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER
            linker: x86_64-linux-gnu-gcc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: cross-${{ matrix.target }}

      - name: Install cross-compilation tools
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.packages }}

      - name: "Cross-check: JIT"
        run: cargo check --no-default-features --features jit --target ${{ matrix.target }}
        env:
          ${{ matrix.linker_env }}: ${{ matrix.linker }}

      - name: "Cross-check: full"
        run: cargo check --features full --target ${{ matrix.target }}
        env:
          ${{ matrix.linker_env }}: ${{ matrix.linker }}

  # ─────────────────────────────────────────────────────────────────────────
  # The MSRV comes from `package.rust-version`, so raising it is one edit in
  # the manifest — the published contract and the job enforcing it cannot
  # disagree. Read with grep rather than `cargo metadata`: the toolchain that
  # would run it is the one this job is still deciding.
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read MSRV from Cargo.toml
        id: msrv
        run: |
          set -euo pipefail
          VERSION=$(grep -m1 '^rust-version = ' Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          if [[ -z "$VERSION" ]]; then
            echo "::error::Cargo.toml declares no rust-version"
            exit 1
          fi
          echo "Declared MSRV: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install Rust ${{ steps.msrv.outputs.version }}
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: msrv-${{ steps.msrv.outputs.version }}

      # Library target only. Dev-dependencies are benchmark harnesses and the
      # competing engines they measure; their MSRVs are not regexr's contract.
      #
      # `--locked` is what makes this job mean anything. An older cargo happily
      # re-resolves Cargo.lock down to whatever it can build and then reports
      # success, so without it the job proves some dependency set works on the
      # MSRV — not the one that ships.
      - name: Check MSRV (all features)
        run: cargo check --features full --lib --locked

  # ─────────────────────────────────────────────────────────────────────────
  # The engines are checked against `regexr::reference`, the executable spec, on
  # randomly generated patterns and inputs. Every correctness bug this suite has
  # caught recently was found here first — the unit tests encode the cases we
  # already know about, this finds the ones we do not.
  #
  # Seeds are fixed rather than random: a red build has to be reproducible
  # locally with the seed from the log, and a job that fails on a different
  # pattern every run gets ignored. Widen coverage by adding seeds, not by
  # randomising them.
  fuzz:
    name: Differential Fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: fuzz

      # Release mode: the oracle runs both engine builds over every case, and a
      # debug build is too slow to cover a useful number of them.
      - name: Build differential oracle
        run: cargo build --release --features full --example diff_oracle

      # The oracle exits non-zero when any engine disagrees with the reference.
      # Its stdout carries a `VAL` sample line for roughly one case in forty, so
      # it goes to a file and only the divergence records are echoed on failure.
      - name: Differential oracle (fixed seeds)
        run: |
          set -uo pipefail
          status=0
          for seed in 7 99 2024; do
            echo "::group::seed ${seed}"
            if ! ./target/release/examples/diff_oracle 20000 "${seed}" \
                 > "oracle-${seed}.out"; then
              status=1
              echo "::error::engine/reference divergence on seed ${seed}"
              grep '^REC' "oracle-${seed}.out" | head -40
            fi
            echo "::endgroup::"
          done
          exit "${status}"

      - name: Upload oracle output
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diff-oracle-output
          path: oracle-*.out

  # ─────────────────────────────────────────────────────────────────────────
  # `--exclude-dev`: the bench suite links the engines it measures against,
  # including C-backed pcre2. An advisory or licence finding there is not
  # something a consumer of the library ever links.
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Install cargo-deny
        uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: cargo-deny

      # `--locked`: audit the dependency versions that are committed, not
      # whatever a fresh resolve happens to pick up on the day CI runs.
      - name: Run cargo-deny
        run: cargo deny --exclude-dev --locked check
